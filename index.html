<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Cartão-Presente Online</title>
  </head>
  <body>
    <div class="birthdayCard">
      <div class="cardFront">
        <div class="front-text">
          <h3 class="happy">FELIZ</h3>
          <h2 class="bday">ANIVERSÁRIO</h2>
          <h3 class="toyou">Meu amor!</h3>
        </div>
        <div class="wrap-deco">
          <div class="decorations"></div>
          <div class="decorationsTwo"></div>
        </div>
        <div class="wrap-decoTwo">
          <div class="decorations"></div>
          <div class="decorationsThree"></div>
        </div>
        <div class="plate">
          <div class="cake"></div>
          <div class="flame"></div>
        </div>
      </div>
      <div class="cardInside">
        <div class="inside-text">
          <h3 class="happy">FELIZ</h3>
          <h2 class="bday">ANIVERSÁRIO</h2>
          <h3 class="toyou">Luana!</h3>
        </div>
        <div class="wishes">
          <p>Meu amor,</p>
          <p>
            Hoje celebramos a sua vida, o seu sorriso e a alegria que você traz
            para todos ao seu redor. Que este dia seja repleto de felicidade,
            saúde e realizações.
          </p>
          <p class="name">Amo-te, Daniel!</p>
        </div>
      </div>
    </div>
  </body>
</html>
